services:
  insurance-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-pipeline-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-pipeline}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-insurance_pipeline}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:4318/v1/traces
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: insurance-pipeline-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: insurance-pipeline-phoenix
    ports:
      - "6006:6006" # Phoenix Web UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    restart: unless-stopped

volumes:
  postgres_data:
