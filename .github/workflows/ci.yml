name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  insurance-backend:
    name: Insurance backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance-pipeline/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: insurance-pipeline/backend/requirements.txt
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest -q

  autopsy:
    name: Autopsy backend and SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline-autopsy
    env:
      AUTOPSY_DATABASE_URL: sqlite:///./ci.db
      PYTHONPATH: packages/autopsy-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline-autopsy/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run Autopsy and SDK tests
        run: python -m pytest -p no:cacheprovider tests packages/autopsy-sdk/tests -q

  insurance-frontend:
    name: Insurance frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance-pipeline/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: insurance-pipeline/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
